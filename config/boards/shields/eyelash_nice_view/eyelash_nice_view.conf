# Enable nice!view
CONFIG_ZMK_DISPLAY=y
# Disable idle blanking
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# 右手のUSBシリアル（CDC ACM）。ZMKのUSB(HID)は使わない
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CRC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DISP_DEF_REFR_PERIOD=10
# 小さな番号表示用: この色(描画の黒)を透明にする
CONFIG_LV_COLOR_CHROMA_KEY_HEX=0x000000
# 左右の画像中継: 1回に送るデータ量（無線の1回の大きさ 65 バイトに収まる値）
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=56
