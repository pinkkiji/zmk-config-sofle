---
include:
  - board: nice_nano//zmk
    shield: eyelash_sofle_right nice_view_adapter nice_view
    artifact-name: sofle_right
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    artifact-name: sofle_left_nostudio
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: sofle_studio_left
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    snippet: zmk-usb-logging
    artifact-name: sofle_left_logging
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=11
    artifact-name: sofle_left_prio11
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DTEST_NOVCOM
    artifact-name: sofle_left_novcom
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DTEST_VCOM1000
    artifact-name: sofle_left_vcom1000
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DTEST_NOVCOM -DCONFIG_EYELASH_DISPLAY_REFRESH=y
    artifact-name: sofle_left_refresh_novcom
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_EYELASH_DISPLAY_REFRESH=y
    artifact-name: sofle_left_refresh
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DTEST_CSLOW
    artifact-name: sofle_left_cslow
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view_adapter nice_view
    cmake-args: -DDTS_EXTRA_CPPFLAGS=-DTEST_SLOWSPI
    artifact-name: sofle_left_slowspi
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
